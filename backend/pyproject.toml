[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-crowd-planner-api"
version = "0.1.0"
description = "Demo FastAPI service for a Delhi transit crowding-aware planner"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1", "duckdb>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
